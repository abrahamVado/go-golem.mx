          format: date-time
          nullable: true
        free_expires_at:
          type: string
          format: date-time
          nullable: true
        blocked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateCompanyRequest:
      type: object
