        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ClientID:
      in: path
      name: clientId
      required: true
      schema:
        type: string
        format: uuid
    PublicKeyID:
      in: path
      name: publicKeyId
      required: true
      schema:
        type: string
        format: uuid
    XTeamID:
      in: header
      name: X-Team-ID
      required: false
      schema:
        type: string
        format: uuid
      description: Optional team selector used by some project endpoints.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OkMessage:
      description: Success message
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
  schemas:
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorBody'

    RegisterRequest:
      type: object
      required: [company_name, name, email, password]
      properties:
        company_name:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        company_slug:
          type: string
    CLIRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    RecoverRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        company_slug:
          type: string
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 10
    MeUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ChangeMyPasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string
    BrowserSessionResponse:
      type: object
      properties:
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
    CLISessionResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
    MeResponse:
      type: object
      description: Best-effort schema inferred from the auth service response.
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatar_url:
          type: string
        status:
          type: string
        account_type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    UserCreateRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          minLength: 8
        status:
          type: string
        account_type:
          type: string
        role_ids:
          type: array
          items:
            type: string
            format: uuid
    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        status:
          type: string
        account_type:
          type: string
        role_ids:
          type: array
          items:
            type: string
            format: uuid
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          nullable: true
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
        avatar_url:
          type: string
        status:
          type: string
        account_type:
          type: string
        premium_expires_at:
